<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>API Exercise</title>
</head>

<style>

    body {
    margin: 0;
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    font-family: sans-serif;

  }

  #image {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  #time, #place {
    position: relative;
    z-index: 1;
  }

  #time {
    font-size: 9vw;
    margin: 0;
    color: red;
    white-space: nowrap;
    text-shadow:  3px 3px 0 black;
  }
  
  #place {
    font-size: 3vw;
    margin: 0;
    text-align: center;
    color: red;
    text-shadow:  1px 1px 0 black;
  }

</style>

<body>

  <img id="image"></img>
  <h1 id="time">Time</h1>
  <p id="place">Place</p>

  <script src="script.js"></script>

</body>
</html>
